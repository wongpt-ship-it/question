<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#273a7a">
<title>中三數學自主練習｜iPad 手寫及動態生成系統</title>
<style>
:root{--ink:#19233c;--muted:#61708a;--blue:#3559d7;--bglight:#f2f5fc;--edge:#dce3f1;--green:#097c55;--red:#c24141}
*{box-sizing:border-box}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-overflow-scrolling:auto}
body{display:flex;flex-direction:column;min-height:0;color:var(--ink);font-family:system-ui,-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:var(--bglight)}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #9ac8ff;outline-offset:1px}
header{flex:0 0 auto;min-height:46px;background:#243a83;color:white;padding:6px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;touch-action:none}
.brand{font-weight:850;font-size:18px;letter-spacing:.2px;white-space:nowrap}.brand small{display:inline-block;margin-left:9px;opacity:.78;font-size:11px;font-weight:500}
.header-summary{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;font-weight:650;font-size:12px}.header-summary span{background:#ffffff22;border:1px solid #ffffff22;border-radius:18px;padding:4px 9px;white-space:nowrap}
.top-controls{flex:0 0 auto;padding:7px 10px 0;display:grid;grid-template-columns:minmax(340px,1.15fr) minmax(0,1.85fr);gap:7px;touch-action:none}
.card{min-width:0;background:white;border:1px solid var(--edge);box-shadow:0 2px 10px #19326d08;border-radius:11px;margin:0;padding:9px 11px}
.card h2{margin:0 0 8px;font-size:16px}.muted{color:var(--muted);font-size:12px;line-height:1.45}
.setup{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:nowrap}
.setup label{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px;font-weight:750;font-size:13px;min-width:0}
.setup label.topic-label{flex:1.45}
.setup label.level-label{flex:0.85}
select,input[type=text],input[type=number],textarea{border-radius:8px;padding:7px 9px;border:1px solid #bfcbe0;background:white;color:var(--ink);width:100%;min-width:0;font-size:15px}
select{height:35px;padding:4px 7px;font-size:13px}textarea{min-height:64px;resize:none}
.btn{border:1px solid var(--edge);border-radius:8px;background:white;color:var(--ink);font-weight:730;padding:7px 10px;min-height:34px;font-size:13px;white-space:nowrap;touch-action:manipulation}.btn:hover{background:#f6f8fc}.btn.primary{border-color:var(--blue);background:var(--blue);color:white}.btn.primary:hover{background:#2748bb}.btn.green{background:#108562;color:white;border-color:#108562}.btn.green:hover{background:#0c6e50}.btn.outline{color:var(--blue);border-color:#9fb3ef}.btn:disabled{opacity:.45;cursor:not-allowed}
.controls{padding:6px 8px;display:flex;align-items:center;min-width:0}
.toolbar{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;white-space:nowrap;min-width:0;width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}
.toolbar::-webkit-scrollbar{display:none}.toolbar .tool{flex:0 0 auto;border-radius:8px;border:1px solid #cfdaef;padding:6px 8px;background:white;font-size:12px;font-weight:700;min-height:32px;line-height:1;touch-action:manipulation}.toolbar .tool.active{background:#e9efff;border-color:#607fe2;color:#263eaf}.toolbar .tool.color-active{border:2px solid #476ce3;padding:5px}.color-dot{width:18px;height:18px;border:1px solid #ddd;border-radius:50%;display:block}.separator{flex:0 0 1px;width:1px;height:21px;background:#d4dcec;margin:0 2px}
.pen-toggle{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:650;color:#52617a;white-space:nowrap;padding:0 4px}.pen-toggle input{width:15px;height:15px;margin:0;accent-color:var(--blue)}
main{flex:1 1 auto;min-height:0;max-height:100%;width:100%;margin:0;padding:8px 10px 10px;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(310px,.88fr);gap:9px;overflow:hidden;align-items:stretch}
.left-col,.right-col{min-width:0;min-height:0;max-height:100%;overflow:hidden;display:flex;flex-direction:column}
.left-col>.question-panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.right-col{gap:8px}
.question-panel{padding:10px 11px}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px;flex:0 0 auto}.title-row h2{margin:2px 0 0;font-size:16px}.eyebrow{font-weight:750;letter-spacing:.3px;color:var(--blue);font-size:11px}
.statusbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.pill{border-radius:16px;padding:4px 8px;background:#edf2ff;color:#3f54a2;font-weight:750;font-size:11px;white-space:nowrap}
.pill.basic{background:#e7f7ef;color:#0a6b48}.pill.advanced{background:#ffefef;color:#b43232}.pill.mc{background:#eef3ff;color:#2c4cb8}

/* 題目與手寫畫布容器：鎖定與解鎖均保持相同內部高度，確保切換鎖定時停留在原位不跳回頂端 */
.sheet{position:relative;display:block;height:0;min-height:0;flex:1 1 0px;border:1px solid #d9e1f1;border-radius:10px;background:white;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;-webkit-overflow-scrolling:touch;isolation:isolate}
.sheet.locked{overflow-y:hidden;touch-action:none}
.sheet.expanded{overflow-y:auto}
.sheet-inner{position:relative;display:flex;flex-direction:column;width:100%;height:auto;min-height:calc(100% + 900px)}
.sheet.expanded #inkCanvas{touch-action:pan-y}
.sheet.expanded.touch-draw #inkCanvas{touch-action:none}
.sheet.locked #inkCanvas{touch-action:none}

.question-content{padding:11px 14px 4px;position:relative;z-index:0;flex:0 0 auto;font-family:"Times New Roman","PingFang HK","Microsoft JhengHei",serif;font-size:18px;line-height:1.6;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.question-content p{margin:5px 0}.question-main{margin-bottom:8px;font-weight:560}.part{display:flex;gap:8px;align-items:baseline;margin:8px 0}.partlabel{font-weight:750;white-space:nowrap;font-family:system-ui,sans-serif;font-size:15px;color:#293c66}
.geom-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(135px,215px);gap:10px;align-items:start}
.svg-area svg,.question-content svg{width:100%;height:auto;max-height:260px}.shape-line{stroke:#19233c;stroke-width:1.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-family:"Times New Roman",serif;line-height:1.1;font-size:.92em}.frac>span:first-child{border-bottom:1.2px solid currentColor;padding:0 4px}.frac>span:last-child{padding:0 4px}.nowrap-eq{white-space:nowrap;display:inline-block}
.data-table{border-collapse:collapse;margin:8px 0;font-size:14px;font-family:system-ui,-apple-system,sans-serif;width:auto;min-width:240px}
.data-table th,.data-table td{border:1px solid #bfcbe0;padding:5px 10px;text-align:center}
.data-table th{background:#f0f4fc;font-weight:750;color:#243a73}
.p2-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0 6px}.p2-choice{display:flex;align-items:baseline;gap:7px;padding:7px 9px;border:1px solid #e3e8f3;border-radius:8px;cursor:pointer;font-family:"Times New Roman","PingFang HK",serif;background:#fbfcff;font-size:16px}.p2-choice b{font-weight:700;min-width:20px;font-family:system-ui,sans-serif}.p2-choice.selected{border-color:#6f91f0;background:#e8efff}.p2-choice:hover{border-color:#8fa7e4}
.workspace{flex:0 0 900px;min-height:900px;margin:5px 10px 9px;border:1px dashed #cfd9ed;border-radius:9px;background:repeating-linear-gradient(to bottom,#fff,#fff 33px,#e8edf6 34px);position:relative}
.sheet.inking,.sheet.inking *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-user-drag:none!important}
#inkCanvas,#liveInkCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#inkCanvas{z-index:2;cursor:crosshair}#inkCanvas.off{pointer-events:none}#liveInkCanvas{z-index:3;pointer-events:none}

/* 右側作答區與獨立底部「下一題」按鈕欄 */
.answers{display:flex;flex:1 1 auto;flex-direction:column;gap:6px;padding:10px 11px;min-height:0;overflow:hidden}.answers .title-row{margin:0}.answers .title-row h2{font-size:16px}
.input-collapsible{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.input-collapsible[hidden]{display:none!important}
.collapsed-banner{flex:0 0 auto;padding:5px 9px;border-radius:8px;background:#f0f4ff;border:1px dashed #b4c5ef;color:#2c468c;font-size:12px;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:8px}
.collapsed-banner[hidden]{display:none!important}
.answer-grid{display:flex;flex-direction:column;align-items:stretch;gap:6px;max-height:24vh;overflow-y:auto;overscroll-behavior:contain}.answer-item{min-width:0;width:100%}.answer-item label{font-size:12px;font-weight:750;display:block;margin-bottom:3px;color:#2b3d63}.answer-item input,.answer-item textarea{padding:6px 9px;min-height:34px;font-size:16px;width:100%;max-width:340px;font-family:"Times New Roman",system-ui,serif}.answer-item textarea{min-height:58px;max-width:100%}
.answer-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:1px 0 0;flex:0 0 auto}.answer-actions .btn{min-height:35px}
.var-strip-wrap{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:4px 6px;background:#f4f7fe;border:1px solid #dce5f7;border-radius:8px;max-width:340px}
.var-strip-wrap[hidden]{display:none!important}
.var-strip-label{font-size:11px;font-weight:750;color:#4f6185;margin-right:2px}
.var-key{min-width:34px;min-height:29px;padding:2px 9px;border-radius:6px;border:1px solid #b8c9ee;background:white;color:#1e3a8a;font-weight:750;font-size:15px;font-style:italic;font-family:"Times New Roman",serif;touch-action:manipulation}
.var-key:active{background:#dbe7ff}
.question-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lock-toggle{display:inline-flex;align-items:center;gap:4px;padding:3px 6px;border:1px solid #d9e2f2;border-radius:7px;background:#f7f9fd;color:#3e4d69;font-size:11px;font-weight:700;white-space:nowrap;vertical-align:middle;cursor:pointer}.lock-toggle input{width:15px;height:15px;margin:0;accent-color:var(--blue)}
.numeric-keypad{width:100%;max-width:340px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:1px 0}.numeric-key{min-width:0;min-height:32px;padding:3px 2px;border:1px solid #d4deef;border-radius:7px;background:#f7f9fe;color:#273958;font-size:14px;font-weight:750;touch-action:manipulation}.numeric-key:active{background:#e5edff;border-color:#829ce5}.numeric-key.special{background:#edf2ff;color:#2444a7}.numeric-key.danger{background:#fff1f1;border-color:#f0caca;color:#a43e3e}.numeric-keypad[hidden]{display:none!important}
.mc-answer-buttons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:100%;max-width:340px}.mc-answer-button{min-height:44px;border:1px solid #cbd6eb;border-radius:9px;background:#f8faff;color:#253958;font-size:19px;font-weight:850;touch-action:manipulation}.mc-answer-button.selected{background:#e7efff;border:2px solid #4169d4;color:#2344a9}
.ineq-answer{padding:6px 8px;border:1px solid #dfe6f3;border-radius:9px;background:#fbfcff;max-width:340px}.ineq-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;margin-top:4px}.ineq-x{font-weight:800;min-width:15px;font-family:"Times New Roman",serif;font-style:italic;font-size:17px}.operator-pick{display:flex;gap:3px;flex:0 0 auto}.operator-pick button{min-width:34px;height:31px;padding:2px 5px;border:1px solid #d2dcee;border-radius:7px;background:white;color:#273755;font-weight:800;font-size:15px;touch-action:manipulation}.operator-pick button.active{background:#e8efff;border:2px solid #5578de;color:#243eaa}.ineq-row input{flex:1;min-width:60px;max-width:120px;height:32px;padding:4px 7px}

/* 批改結果與詳解獨立滾動區 */
.feedback-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px;touch-action:pan-y}
.result{padding:8px 10px;border-radius:9px;border:1px solid #cad6eb;background:#f7f9fe;line-height:1.45;font-size:13px;flex:0 0 auto}.result.success{background:#eaf8f1;border-color:#a2dcc2;color:#075739}.result.wrong{background:#fff0f0;border-color:#ffc0c0;color:#9a3030}.result.notice{background:#fff8e7;border-color:#ead5a1;color:#80551c}.result h3{font-size:14px;margin:0 0 3px}
.solution{padding:9px 11px;background:#f8faff;border:1px solid #d7e1f7;border-radius:9px;color:#263652;font-size:14px;line-height:1.62;font-family:"Times New Roman","PingFang HK",serif;flex:0 0 auto}.solution .step{margin:6px 0;border-bottom:1px solid #e3eaf6;padding-bottom:5px}.solution .step:last-child{border:0}.solution b{color:#3452b0;font-family:system-ui,sans-serif}
#solutionBox[hidden]{display:none!important}

/* 獨立在最下方的「下一題」按鈕區 */
.next-btn-bar{flex:0 0 auto;padding-top:6px;border-top:1px solid var(--edge);margin-top:auto;display:flex;align-items:center}
.next-btn-bar[hidden]{display:none!important}
.next-btn-bar .btn{width:100%;min-height:40px;font-size:15px;font-weight:800;justify-content:center;display:flex;align-items:center}

.progress-card{padding:8px 11px;flex:0 0 auto}.progress-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.progress-card h2{font-size:13px;margin:0}.progressline{height:6px;border-radius:8px;background:#e8edfa;overflow:hidden;margin:5px 0}.progressfill{height:100%;background:var(--blue);width:0%;transition:width .25s}.mini{font-size:11px;color:var(--muted)}
@media(max-width:960px){.top-controls{grid-template-columns:1fr;gap:5px}.controls{min-height:40px}}
</style>
</head>
<body>
<header>
 <div class="brand">✏️ 中三數學自主練習 <small>3A冊 第1–4章 · 動態隨機生成 · Apple Pencil 書寫</small></div>
 <div class="header-summary"><span id="totalBadge">已完成 0 題</span><span id="accuracyBadge">正確率 —</span></div>
</header>
<div class="top-controls">
 <section class="card setup">
  <label class="topic-label">課題<select id="topicSelect">
   <optgroup label="3A冊 第1章 · 續多項式的因式分解">
    <option value="ch1_all">📚 第1章 全部課題混合</option>
    <option value="ch1_1">1.1 公因式、併項法及恆等式</option>
    <option value="ch1_2">1.2 十字相乘法（一元及二元）</option>
    <option value="ch1_3">1.3 「由此」進階分解與換元法</option>
    <option value="ch1_mc">1.4 多項選擇題（因式分解）</option>
   </optgroup>
   <optgroup label="3A冊 第2章 · 整數指數律">
    <option value="ch2_all">⚡ 第2章 全部課題混合</option>
    <option value="ch2_1">2.1 零指數及負整數指數律化簡</option>
    <option value="ch2_2">2.2 科學記數法與應用題</option>
    <option value="ch2_mc">2.3 多項選擇題（整數指數律）</option>
   </optgroup>
   <optgroup label="3A冊 第3章 · 一元一次不等式">
    <option value="ch3_all">🚧 第3章 全部課題混合</option>
    <option value="ch3_1">3.1 解一元一次不等式及數線圖示</option>
    <option value="ch3_2">3.2 不等式的整數解與建立不等式</option>
    <option value="ch3_3">3.3 不等式應用題與解說題</option>
    <option value="ch3_mc">3.4 多項選擇題（一元一次不等式）</option>
   </optgroup>
   <optgroup label="3A冊 第4章 · 百分法(二)（不含稅務）">
    <option value="ch4_all">📊 第4章 全部課題混合</option>
    <option value="ch4_1">4.1 連續百分變化與部分變化</option>
    <option value="ch4_2">4.2 固定率增長與折舊</option>
    <option value="ch4_3">4.3 單利息與複利息</option>
    <option value="ch4_mc">4.4 多項選擇題（百分法(二)）</option>
   </optgroup>
  </select></label>
  <label class="level-label">難度<select id="levelSelect">
   <option value="basic">🟢 初階</option>
   <option value="advanced">🔴 進階</option>
   <option value="all">🟡 初階＋進階</option>
  </select></label>
  <button class="btn primary" id="startBtn">出新題</button>
 </section>
 <section class="card controls">
  <div class="toolbar" id="tools">
   <button type="button" class="tool" data-tool="off">👆 閱讀</button><button type="button" class="tool active" data-tool="pen">✏️ 筆</button><button type="button" class="tool" data-tool="highlighter">🟨 螢光筆</button><button type="button" class="tool" data-tool="eraser">◻️ 擦膠</button><span class="separator"></span>
   <button type="button" class="tool color-active" data-color="#243858" title="深藍"><span class="color-dot" style="background:#243858"></span></button><button type="button" class="tool" data-color="#d13b44" title="紅色"><span class="color-dot" style="background:#d13b44"></span></button><button type="button" class="tool" data-color="#1368c5" title="藍色"><span class="color-dot" style="background:#1368c5"></span></button><span class="separator"></span>
   <button type="button" class="tool" id="undoBtn">↶ 復原</button><button type="button" class="tool" id="redoBtn">↷ 重做</button><button type="button" class="tool" id="clearBtn">清除</button>
   <label class="pen-toggle" title="忽略手指，避免手掌誤觸"><input type="checkbox" id="penOnly" checked>只用 Pencil</label>
  </div>
 </section>
</div>
<main>
 <div class="left-col">
  <section class="card question-panel" id="questionPanel">
   <div class="title-row">
    <div>
     <span class="eyebrow" id="topicLabel">中三數學練習</span>
     <h2 class="question-title">第 <span id="questionNum">1</span> 題 <label class="lock-toggle"><input type="checkbox" id="lockSheet" checked>鎖定題目</label> <small class="muted" id="marksLabel"></small></h2>
    </div>
    <div class="statusbar">
     <span class="pill basic" id="levelBadge">初階</span>
     <span class="pill" id="gradingLabel">自動批改</span>
    </div>
   </div>
   <div id="sheet" class="sheet locked"><div id="sheetInner" class="sheet-inner"><div id="questionContent" class="question-content" aria-live="polite"></div><div class="workspace"></div><canvas id="inkCanvas" aria-label="可手寫的透明畫布"></canvas><canvas id="liveInkCanvas" aria-hidden="true"></canvas></div></div>
  </section>
 </div>
 <aside class="right-col">
  <section class="card answers" id="answerCard">
   <div class="title-row">
    <h2>⌨️ 輸入答案</h2>
    <div style="display:flex;align-items:center;gap:6px">
     <button type="button" class="btn" id="toggleInputBtn" style="min-height:26px;padding:3px 8px;font-size:11px">🔼 收起輸入區</button>
     <span class="pill" id="answerModeBadge">作答區</span>
    </div>
   </div>
   <div id="collapsedBanner" class="collapsed-banner" hidden>
    <span>已收起輸入鍵盤以便閱讀下方詳解</span>
    <button type="button" class="btn outline" id="expandBannerBtn" style="min-height:25px;padding:2px 8px;font-size:11px">展開輸入</button>
   </div>
   <div id="inputAreaWrap" class="input-collapsible">
    <div id="varStripWrap" class="var-strip-wrap" hidden></div>
    <div id="answerInputs" class="answer-grid"></div>
    <div id="answerKeypad" class="numeric-keypad" aria-label="數字及代數符號鍵盤">
     <button type="button" class="numeric-key" data-key="7">7</button><button type="button" class="numeric-key" data-key="8">8</button><button type="button" class="numeric-key" data-key="9">9</button><button type="button" class="numeric-key special" data-key="+">＋</button><button type="button" class="numeric-key special" data-key="-">−</button>
     <button type="button" class="numeric-key" data-key="4">4</button><button type="button" class="numeric-key" data-key="5">5</button><button type="button" class="numeric-key" data-key="6">6</button><button type="button" class="numeric-key special" data-key="(">(</button><button type="button" class="numeric-key special" data-key=")">)</button>
     <button type="button" class="numeric-key" data-key="1">1</button><button type="button" class="numeric-key" data-key="2">2</button><button type="button" class="numeric-key" data-key="3">3</button><button type="button" class="numeric-key special" data-key="²">²</button><button type="button" class="numeric-key special" data-key="³">³</button>

function makeMC(type, level, statement, correct, wrongs, steps, variantKey) {
    const arr = [correct], seen = new Set([correct]);

// ==================== 代數式語法分析及數值檢驗引擎 ====================
function normalizeAlgExpr(raw) {
    let s = String(raw || '').trim();

         .replace(/[＋]/g, '+')
         .replace(/[×✕＊]/g, '*')

function tokenizeAlg(s) {

// ==================== 第 1 章：續多項式的因式分解 生成引擎 ====================
function generateCh1_1(level) {

                    { sub: '', sol: `= [${a}(<i>${v}</i> − ${d}) ${sign} ${b}]<sup>2</sup>` },
                    { sub: '', sol: `= <b>${finalHtml}</b>` }

            ]);
            const r1 = -(cfg.p1 * cfg.q1), r2 = -(cfg.p2 * cfg.q2);
            const sumR = r1 + r2, prodR = r1 * r2;
            const partAExpr = fmtQuad(1, -sumR, prodR, '<i>y</i>', '');
            const innerX = fmtPolyTerms([[1, '<i>x</i><sup>2</sup>'], [cfg.m, '<i>x</i>']]);
            const partBExpr = `(${innerX})<sup>2</sup> − ${sumR}(${innerX}) + ${prodR}`;
            const ansAHtml = `(<i>y</i> − ${r1})(<i>y</i> − ${r2})`;
            const ansAPlain = `(y-${r1})(y-${r2})`;
            const roots = [cfg.p1, cfg.q1, cfg.p2, cfg.q2].sort((a, b) => a - b);
            const ansBHtml = roots.map(r => `(${fmtLinear(1, '<i>x</i>', r, '')})`).join('');
            const ansBPlain = roots.map(r => `(${toPlainLinear(1, 'x', r, '')})`).join('');
            return {
                id: `q_${Date.now()}_${Math.random()}`, type: 'ch1_3', level: 'advanced',
                text: ``, marks: '(5分)', vars: ['x', 'y'],
                subs: [
                    { label: '(a)', text: `因式分解 ${partAExpr}。` },
                    { label: '(b)', text: `由此，因式分解 ${partBExpr}。` }
                ],
                ms: [
                    { sub: '(a)', sol: `${partAExpr} = <b>${ansAHtml}</b>` },
                    { sub: '(b)', sol: `設 <i>y</i> = ${innerX}，由 (a) 得：<br>原式 = (${innerX} − ${r1})(${innerX} − ${r2})` },
                    { sub: '', sol: `= <b>${ansBHtml}</b>` }
                ],
                ansCheck: [
                    { label: '(a) 因式分解', target: ansAPlain, display: ansAHtml },
                    { label: '(b) 因式分解', target: ansBPlain, display: ansBHtml }
                ]
            };
        } else if (subType === 2) {
            const k = pickRandom([2, 3]);
            const a1 = 3, b1 = 1, a2 = 4, b2 = -9;
            const A = a1 * a2, B = a1 * b2 + b1 * a2, C = b1 * b2;
            const partAExpr = fmtQuad(A, B, C, '<i>x</i>', '<i>y</i>');
            const partBExpr = `${k * A}<i>a</i><sup>2</sup> − ${k * Math.abs(B)}<i>a</i>(<i>a</i> + <i>b</i>) − ${k * Math.abs(C)}(<i>a</i> + <i>b</i>)<sup>2</sup>`;
            const ansAHtml = `(3<i>x</i> + <i>y</i>)(4<i>x</i> − 9<i>y</i>)`;
            const ansAPlain = `(3x+y)(4x-9y)`;
            const ansBHtml = `−${k}(4<i>a</i> + <i>b</i>)(5<i>a</i> + 9<i>b</i>)`;
            const ansBPlain = `-${k}(4a+b)(5a+9b)`;
            return {
                id: `q_${Date.now()}_${Math.random()}`, type: 'ch1_3', level: 'advanced',
                text: ``, marks: '(5分)', vars: ['x', 'y', 'a', 'b'],
                subs: [
                    { label: '(a)', text: `因式分解 ${partAExpr}。` },
                    { label: '(b)', text: `由此，因式分解 ${partBExpr}。` }
                ],
                ms: [
                    { sub: '(a)', sol: `${partAExpr} = <b>${ansAHtml}</b>` },
                    { sub: '(b)', sol: `設 <i>x</i> = <i>a</i> 及 <i>y</i> = <i>a</i> + <i>b</i>。<br>${partBExpr} = ${k}(${partAExpr}) = ${k}(3<i>a</i> + <i>a</i> + <i>b</i>)[4<i>a</i> − 9(<i>a</i> + <i>b</i>)]` },
                    { sub: '', sol: `= ${k}(4<i>a</i> + <i>b</i>)(−5<i>a</i> − 9<i>b</i>) = <b>${ansBHtml}</b>` }
                ],
                ansCheck: [
                    { label: '(a) 因式分解', target: ansAPlain, display: ansAHtml },
                    { label: '(b) 因式分解', target: ansBPlain, display: ansBHtml }
                ]
            };
        } else {
            const m = pickRandom([5, 7, 11]);
            const n1 = 2 * m + 3, n2 = 2 * m + 2;
            const partAi = `4<i>x</i><sup>2</sup> − 9<i>y</i><sup>2</sup>`;
            const partAii = `2<i>x</i><sup>2</sup> + 7<i>xy</i> − 15<i>y</i><sup>2</sup>`;
            const ansAiHtml = `(2<i>x</i> + 3<i>y</i>)(2<i>x</i> − 3<i>y</i>)`, ansAiPlain = `(2x+3y)(2x-3y)`;
            const ansAiiHtml = `(<i>x</i> + 5<i>y</i>)(2<i>x</i> − 3<i>y</i>)`, ansAiiPlain = `(x+5y)(2x-3y)`;
            const ansBHtml = buildFrac(`${m}`, `(<i>x</i> + 5<i>y</i>)(2<i>x</i> + 3<i>y</i>)`);
            const ansBPlain = `${m}/((x+5y)(2x+3y))`;
            return {
                id: `q_${Date.now()}_${Math.random()}`, type: 'ch1_3', level: 'advanced',
                text: ``, marks: '(6分)', vars: ['x', 'y'],
                subs: [
                    { label: '(a)', text: `因式分解 (i) ${partAi}； (ii) ${partAii}。` },
                    { label: '(b)', text: `由此，化簡 ${buildFrac(n1, partAii)} − ${buildFrac(n2, partAi)}。` }
                ],
                ms: [
                    { sub: '(a)(i)', sol: `${partAi} = <b>${ansAiHtml}</b>` },
                    { sub: '(a)(ii)', sol: `${partAii} = <b>${ansAiiHtml}</b>` },
                    { sub: '(b)', sol: `原式 = ${buildFrac(`${n1}(2<i>x</i> + 3<i>y</i>) − ${n2}(<i>x</i> + 5<i>y</i>)`, `(<i>x</i> + 5<i>y</i>)(2<i>x</i> + 3<i>y</i>)(2<i>x</i> − 3<i>y</i>)`)}` },
                    { sub: '', sol: `= ${buildFrac(`${m}(2<i>x</i> − 3<i>y</i>)`, `(<i>x</i> + 5<i>y</i>)(2<i>x</i> + 3<i>y</i>)(2<i>x</i> − 3<i>y</i>)`)} = <b>${ansBHtml}</b>` }
                ],
                ansCheck: [
                    { label: '(a)(i) 因式分解', target: ansAiPlain, display: ansAiHtml },
                    { label: '(a)(ii) 因式分解', target: ansAiiPlain, display: ansAiiHtml },
                    { label: '(b) 化簡結果（用 / 表示分數）', target: ansBPlain, display: ansBHtml }
                ]
            };
        }
    }
}

function generateCh1_MC() {
    const subType = chooseVariant('ch1_mc', randomInt(1, 5));
    if (subType === 1) {
        const a = randomInt(2, 4), c = randomInt(3, 6), b = randomInt(2, 5), d = randomInt(1, 5);
        const A = a * c, B = a * d + b * c, C = b * d;
        const expr = `−${C} + ${B}<i>d</i> − ${A}<i>d</i><sup>2</sup>`;
        const correct = `−(${a}<i>d</i> − ${b})(${c}<i>d</i> − ${d})`;
        const wrongs = [
            `−(${a}<i>d</i> + ${b})(${c}<i>d</i> − ${d})`,
            `−(${a}<i>d</i> − ${d})(${c}<i>d</i> − ${b})`,
            `(${a}<i>d</i> − ${b})(${c}<i>d</i> + ${d})`
        ];
        return makeMC('ch1_mc', 'basic', `因式分解 ${expr}。`, correct, wrongs, [
            `${expr} = −(${A}<i>d</i><sup>2</sup> − ${B}<i>d</i> + ${C})`,
            `= ${correct}`
        ], subType);
    } else if (subType === 2) {
        const a = randomInt(2, 4), b = randomInt(1, 3), d = randomInt(2, 5);
        const B = b - a * d, C = -b * d;
        const expr = `${a}<i>a</i> + ${b === 1 ? '' : b}<i>b</i> + ${fmtQuad(a, B, C, '<i>a</i>', '<i>b</i>')}`;
        const br1 = `${a}<i>a</i> + ${b === 1 ? '' : b}<i>b</i>`;
        const correct = `(${br1})(<i>a</i> − ${d}<i>b</i> + 1)`;
        const wrongs = [
            `(${br1})(<i>a</i> + ${d}<i>b</i> + 1)`,
            `(${a}<i>a</i> − ${b === 1 ? '' : b}<i>b</i>)(<i>a</i> − ${d}<i>b</i> − 1)`,
            `(${br1})(<i>a</i> − ${d}<i>b</i> − 1)`
        ];
        return makeMC('ch1_mc', 'advanced', `因式分解 ${expr}。`, correct, wrongs, [
            `${expr} = (${br1}) + (<i>a</i> − ${d}<i>b</i>)(${br1})`,
            `= ${correct}`
        ], subType);
    } else if (subType === 3) {
        const r = randomInt(2, 5), rOther = randomInt(3, 7);
        const correct = fmtQuad(1, -(r + rOther), r * rOther, '<i>x</i>', '');
        const wrongs = [
            fmtQuad(1, 2 * r, r * r, '<i>x</i>', ''),
            fmtQuad(1, r + rOther, r * rOther, '<i>x</i>', ''),
            fmtQuad(1, rOther - r - 1, -r * rOther, '<i>x</i>', '')
        ];
        return makeMC('ch1_mc', 'basic', `下列哪個數式的其中一個因式是 <i>x</i> − ${r}？`, correct, wrongs, [
            `因為 ${correct} = (<i>x</i> − ${r})(<i>x</i> − ${rOther})，所以 <i>x</i> − ${r} 是它的因式。`
        ], subType);
    } else if (subType === 4) {
        const r1 = randomInt(4, 9), t = -randomInt(5, 11);
        const B = -(r1 - t), k = -r1 * t;
        const expr = `<i>x</i><sup>2</sup> ${B >= 0 ? '+ ' + B : '− ' + Math.abs(B)}<i>x</i> + <i>k</i> &equiv; (<i>x</i> − ${r1})(<i>x</i> + <i>t</i>)`;
        const correct = `${k}`;
        const wrongs = [`−${k}`, `${t}`, `${-t}`];
        return makeMC('ch1_mc', 'basic', `若 ${expr}，則 <i>k</i> =`, correct, wrongs, [
            `比較 <i>x</i> 的係數：−${r1} + <i>t</i> = ${B} &rArr; <i>t</i> = ${t}。`,
            `比較常數項：<i>k</i> = (−${r1})(${t}) = ${k}。`
        ], subType);
    } else {
        const p = pickRandom([2, 3, 5]), c = pickRandom([6, 8, 10]);
        const m1 = -(1 + p * c), m3 = 2 + p * (c / 2), mWrong = p + c - 2;
        const stmt = `若 ${p}<i>y</i><sup>2</sup> + <i>my</i> + ${c} &equiv; (${p}<i>y</i> + <i>a</i>)(<i>y</i> + <i>b</i>)，其中 <i>a</i> 和 <i>b</i> 為整數，下列哪些是 <i>m</i> 的可能值？<br>I. ${m1}<br>II. ${mWrong}<br>III. ${m3}`;
        return makeMC('ch1_mc', 'advanced', stmt, '只有 I 及 III', ['只有 I 及 II', '只有 II 及 III', 'I、II 及 III'], [
            `由恆等式可得 <i>ab</i> = ${c} 及 <i>a</i> + ${p}<i>b</i> = <i>m</i>。`,
            `當 <i>a</i> = −1, <i>b</i> = −${c} 時，<i>m</i> = −1 + ${p}(−${c}) = ${m1}（I 可能）。`,
            `當 <i>a</i> = 2, <i>b</i> = ${c / 2} 時，<i>m</i> = 2 + ${p}(${c / 2}) = ${m3}（III 可能）。`
        ], subType);
    }
}

// ==================== 第 2 章：整數指數律（不含進制）生成引擎 ====================
function generateCh2_1(level) {
    const actualLevel = level === 'all' ? pickRandom(['basic', 'advanced']) : level;
    if (actualLevel === 'basic') {
        const subType = chooseVariant('ch2_1_b', randomInt(1, 3));
        if (subType === 1) {
            const b1 = pickRandom([2, 3, 4, 5]), e1 = pickRandom([2, 3]);
            const b2 = pickRandom([2, 3, 4]), b3 = b2 * pickRandom([2, 3]);
            const valA = Math.pow(b1, e1);
            const valB = Math.pow(b3 / b2, 3);
            return {
                id: `q_${Date.now()}_${Math.random()}`, type: 'ch2_1', level: 'basic',
                text: `試不使用計算機，求下列各數式的值。（如有需要，答案以分數 a/b 表示。）`, marks: '(4分)', vars: [],
                subs: [
                    { label: '(a)', text: `${b1}<sup>−${e1}</sup> &times; (−${randomInt(2, 9)})<sup>0</sup>` },
                    { label: '(b)', text: `${b2}<sup>−3</sup> &divide; ${b3}<sup>−3</sup>` }
                ],
                ms: [
                    { sub: '(a)', sol: `原式 = ${buildFrac(1, `${b1}<sup>${e1}</sup>`)} &times; 1 = <b>${buildFrac(1, valA)}</b>` },
                    { sub: '(b)', sol: `原式 = (${buildFrac(b2, b3)})<sup>−3</sup> = (${buildFrac(1, b3 / b2)})<sup>−3</sup> = <b>${valB}</b>` }
                ],
                ansCheck: [
                    { label: '(a) 數值（如 1/27）', target: `1/${valA}`, display: `1/${valA}`, mode: 'num' },
                    { label: '(b) 數值', target: `${valB}`, display: `${valB}`, mode: 'num' }
                ]
            };
        } else if (subType === 2) {
            const vars = pickRandom([['m', 'n'], ['x', 'y'], ['p', 'q']]);
            const [v1, v2] = vars;
            const p = randomInt(2, 5), q = randomInt(2, 5), k = randomInt(2, 3);
            const exprA = `(<i>${v1}</i><sup>${p}</sup><i>${v2}</i><sup>−${q}</sup>)<sup>−${k}</sup>`;
            const ansAHtml = buildFrac(`<i>${v2}</i><sup>${q * k}</sup>`, `<i>${v1}</i><sup>${p * k}</sup>`);
            const ansAPlain = `${v2}^${q * k}/${v1}^${p * k}`;
            const c = pickRandom([2, 3, 4]), r = randomInt(4, 7);
            const exprB = `(−${c}<i>${v1}</i><sup>${r}</sup>)(${c * 2}<i>${v1}</i>)<sup>−2</sup>`;
            const denB = 4 * c;
            const ansBHtml = `−${buildFrac(`<i>${v1}</i><sup>${r - 2}</sup>`, denB)}`;
            const ansBPlain = `-${v1}^${r - 2}/${denB}`;
            return {
                id: `q_${Date.now()}_${Math.random()}`, type: 'ch2_1', level: 'basic',
                text: `化簡下列各數式，並以正指數表示答案。`, marks: '(4分)', vars,
                subs: [
                    { label: '(a)', text: exprA },
                    { label: '(b)', text: exprB }
                ],
                ms: [
                    { sub: '(a)', sol: `${exprA} = <i>${v1}</i><sup>−${p * k}</sup><i>${v2}</i><sup>${q * k}</sup> = <b>${ansAHtml}</b>` },
                    { sub: '(b)', sol: `${exprB} = (−${c}<i>${v1}</i><sup>${r}</sup>)(${buildFrac(1, `${(c * 2) ** 2}<i>${v1}</i><sup>2</sup>`)}) = <b>${ansBHtml}</b>` }
                ],
                ansCheck: [
                    { label: '(a) 正指數答案', target: ansAPlain, display: ansAHtml, mode: 'pos_alg' },
                    { label: '(b) 正指數答案', target: ansBPlain, display: ansBHtml, mode: 'pos_alg' }
                ]
            };
        } else {
            const vars = pickRandom([['v', 's'], ['a', 'b']]);
            const [v1, v2] = vars;
            const p1 = randomInt(2, 5), p2 = randomInt(1, 4), q1 = randomInt(1, 3), q2 = randomInt(2, 5);
            const exprA = buildFrac(`<i>${v1}</i><sup>${p1}</sup><i>${v2}</i><sup>−${q1}</sup>`, `<i>${v1}</i><sup>−${p2}</sup><i>${v2}</i><sup>${q2}</sup>`);
            const ansAHtml = buildFrac(`<i>${v1}</i><sup>${p1 + p2}</sup>`, `<i>${v2}</i><sup>${q1 + q2}</sup>`);
            const ansAPlain = `${v1}^${p1 + p2}/${v2}^${q1 + q2}`;
            const k = randomInt(2, 4), m = randomInt(2, 3);
            const exprB = buildFrac(`<i>${v2}</i><sup>${k}</sup>`, `(<i>${v1}</i><i>${v2}</i><sup>−${m}</sup>)<sup>4</sup>`);
            const ansBHtml = buildFrac(`<i>${v2}</i><sup>${k + 4 * m}</sup>`, `<i>${v1}</i><sup>4</sup>`);
            const ansBPlain = `${v2}^${k + 4 * m}/${v1}^4`;
            return {
                id: `q_${Date.now()}_${Math.random()}`, type: 'ch2_1', level: 'basic',
                text: `化簡下列各數式，並以正指數表示答案。`, marks: '(4分)', vars,
                subs: [
                    { label: '(a)', text: exprA },
                    { label: '(b)', text: exprB }
                ],
                ms: [
                    { sub: '(a)', sol: `${exprA} = ${buildFrac(`<i>${v1}</i><sup>${p1} − (−${p2})</sup>`, `<i>${v2}</i><sup>${q2} − (−${q1})</sup>`)} = <b>${ansAHtml}</b>` },
                    { sub: '(b)', sol: `${exprB} = ${buildFrac(`<i>${v2}</i><sup>${k}</sup>`, `<i>${v1}</i><sup>4</sup><i>${v2}</i><sup>−${4 * m}</sup>`)} = <b>${ansBHtml}</b>` }
                ],
                ansCheck: [
                    { label: '(a) 正指數答案', target: ansAPlain, display: ansAHtml, mode: 'pos_alg' },
                    { label: '(b) 正指數答案', target: ansBPlain, display: ansBHtml, mode: 'pos_alg' }
                ]
            };
        }
    } else {
        const subType = chooseVariant('ch2_1_a', randomInt(1, 3));
        if (subType === 1) {
            const vars = ['m', 'n'];
            const p1 = randomInt(3, 5), q1 = randomInt(2, 4), p2 = randomInt(2, 3), q2 = randomInt(3, 5);
            const expr = buildFrac(`27(<i>m</i><sup>${p1}</sup><i>n</i><sup>−${q1}</sup>)<sup>−3</sup>`, `(3<i>m</i><sup>${p2}</sup><i>n</i><sup>${q2}</sup>)<sup>2</sup>`);
            const mExp = 3 * p1 + 2 * p2, nExp = 3 * q1 - 2 * q2;
            const ansHtml = nExp >= 0
                ? buildFrac(`3${nExp === 0 ? '' : (nExp === 1 ? '<i>n</i>' : `<i>n</i><sup>${nExp}</sup>`)}`, `<i>m</i><sup>${mExp}</sup>`)
                : buildFrac(`3`, `<i>m</i><sup>${mExp}</sup><i>n</i><sup>${-nExp}</sup>`);
            const ansPlain = nExp >= 0 ? `3*n^${nExp}/m^${mExp}` : `3/(m^${mExp}*n^${-nExp})`;
            return {
                id: `q_${Date.now()}_${Math.random()}`, type: 'ch2_1', level: 'advanced',
                text: `化簡 ${expr}，並以正指數表示答案。`, marks: '(3分)', vars,
                subs: [],
                ms: [
                    { sub: '', sol: `原式 = ${buildFrac(`27<i>m</i><sup>−${3 * p1}</sup><i>n</i><sup>${3 * q1}</sup>`, `9<i>m</i><sup>${2 * p2}</sup><i>n</i><sup>${2 * q2}</sup>`)}` },
                    { sub: '', sol: `= 3<i>m</i><sup>−${mExp}</sup><i>n</i><sup>${nExp}</sup> = <b>${ansHtml}</b>` }
                ],

            };
        } else if (subType === 2) {
            const base = pickRandom([5, 7]);
            const k = randomInt(2, 3);
            const exprA = buildFrac(`${base * base}`, `(${base}<sup>${k}<i>n</i> + 1</sup>)<sup>3</sup>`);

            const nCoef = 3 * a1 - 2, constCoef = -6 - 2 * a2;

            const ansBPlain = `10^(${nCoef}n-${Math.abs(constCoef)})`;
            return {
                id: `q_${Date.now()}_${Math.random()}`, type: 'ch2_1', level: 'advanced',
                text: `已知 <i>n</i> 為正整數，化簡下列各數式並以正指數表示答案。`, marks: '(4分)', vars: ['n'],

                    { sub: '(b)', sol: `${exprB} = (10<sup>3</sup>)<sup>${a1}<i>n</i> − 2</sup> &times; (10<sup>−2</sup>)<sup><i>n</i> + ${a2}</sup> = <b>${ansBHtml}</b>` }
                ],
                ansCheck: [
                    { label: '(a) 正指數答案', target: ansAPlain, display: ansAHtml, mode: 'pos_alg' },
                    { label: '(b) 正指數答案', target: ansBPlain, display: ansBHtml, mode: 'pos_alg' }
                ]
            };
        } else {
            const b = pickRandom([2, 3, 5]);
            const e1 = randomInt(44, 52), e2 = randomInt(25, 29), e3 = randomInt(13, 16);
            const items = [
                { str: `${b}<sup>${e1}</sup>`, plain: `${b}^${e1}`, exp: e1 },
                { str: `${b * b}<sup>${e2}</sup>`, plain: `${b * b}^${e2}`, exp: 2 * e2 },
                { str: `${b * b * b}<sup>${e3}</sup>`, plain: `${b * b * b}^${e3}`, exp: 3 * e3 }
            ];
            while (items[0].exp === items[1].exp || items[1].exp === items[2].exp || items[0].exp === items[2].exp) {
                items[0].exp++; items[0].str = `${b}<sup>${items[0].exp}</sup>`; items[0].plain = `${b}^${items[0].exp}`;
            }
            const sorted = items.slice().sort((x, y) => y.exp - x.exp);

const flipIneq = { '>': '<', '<': '>', '>=': '<=', '<=': '>=' };

function buildNumberLineSVG(op, valText, isNeg = false) {
    const isRight = (op === '>' || op === '>=');
    const isClosed = (op === '>=' || op === '<=');
    const xZero = isNeg ? 150 : 75;
    const xVal = isNeg ? 85 : 145;

    const arrowPts = isRight ? "205,22 197,18 197,26" : "25,22 33,18 33,26";
    return `<svg viewBox="0 0 235 64" style="max-width:230px;height:auto;display:block;margin:4px 0">
        <line x1="15" y1="42" x2="215" y2="42" stroke="#19233c" stroke-width="1.6"/>

        <text x="${xZero}" y="58" font-size="12" text-anchor="middle" fill="#19233c" font-family="Times New Roman">0</text>
        <line x1="${xVal}" y1="22" x2="${xVal}" y2="42" stroke="#243a83" stroke-width="1.6"/>
        <line x1="${xVal}" y1="22" x2="${arrowEnd}" y2="22" stroke="#243a83" stroke-width="2"/>

    </svg>`;
}

                    { sub: '', sol: `兩邊同乘以 12： 6(${a1}<i>x</i> − ${b1}) − 2(${a2}<i>x</i> + ${b2}) ${ineqHtmlMap[op]} 3(${a3}<i>x</i> − ${b3})` },
                    { sub: '', sol: `${6 * a1 - 2 * a2}<i>x</i> − ${6 * b1 + 2 * b2} ${ineqHtmlMap[op]} ${3 * a3}<i>x</i> − ${3 * b3}` },
                    { sub: '', sol: `${coef}<i>x</i> ${ineqHtmlMap[op]} ${rhs} &rArr; <b><i>x</i> ${ineqHtmlMap[finalOp]} ${valHtml}</b>` },
                    { sub: '數線圖示', sol: buildNumberLineSVG(finalOp, valPlain, (rhs / coef) < 0) }
                ],
                ineqCheck: [{ label: '不等式的解', op: finalOp, val: rhs / coef, display: `x ${ineqHtmlMap[finalOp]} ${valHtml}` }]
            };
        }
    }
}

function generateCh3_2(level) {
    const actualLevel = level === 'all' ? pickRandom(['basic', 'advanced']) : level;
    if (actualLevel === 'basic') {
        const subType = chooseVariant('ch3_2_b', randomInt(1, 2));
        if (subType === 1) {
            const bound = randomInt(2, 5);
            const c = randomInt(2, 5);
            const lhsConst = 4 * bound + c;
            const expr = `${lhsConst} − <i>x</i> &ge; 5<i>x</i> − (2<i>x</i> − ${c})`;
            const list = [];
            for (let i = 0; i <= bound; i++) list.push(i);
            return {
                id: `q_${Date.now()}_${Math.random()}`, type: 'ch3_2', level: 'basic',
                text: ``, marks: '(4分)', vars: ['x'],
                subs: [
                    { label: '(a)', text: `求滿足不等式 ${expr} 的 <i>x</i> 值的範圍。` },
                    { label: '(b)', text: `寫出所有能滿足 (a) 中的不等式的非負整數。（以頓號或逗號分隔）` }
                ],
                ms: [
                    { sub: '(a)', sol: `${lhsConst} − <i>x</i> &ge; 3<i>x</i> + ${c} &rArr; −4<i>x</i> &ge; −${4 * bound} &rArr; <b><i>x</i> &le; ${bound}</b>` },
                    { sub: '(b)', sol: `非負整數包括 <b>${list.join('、')}</b>。` }
                ],
                ineqCheck: [{ label: '(a) x 值的範圍', op: '<=', val: bound, display: `x <= ${bound}` }],
                ansCheck: [{ label: '(b) 所有非負整數', target: list.join(','), display: list.join('、'), mode: 'int_list' }]
            };
        } else {
            const negCount = randomInt(2, 5);
            const a = randomInt(4, 6);
            const b = randomInt(6, 12);
            const k = (b + (a - 2) * negCount) / 2;
            const expr = `${buildFrac(`${a}<i>x</i> − ${2 * k}`, 2)} &ge; <i>x</i> − ${b}`;
            return {
                id: `q_${Date.now()}_${Math.random()}`, type: 'ch3_2', level: 'basic',
                text: ``, marks: '(4分)', vars: ['x'],
                subs: [
                    { label: '(a)', text: `求滿足不等式 ${expr} 的 <i>x</i> 值的範圍。` },
                    { label: '(b)', text: `求滿足 (a) 中的不等式的負整數的數目。` }
                ],
                ms: [
                    { sub: '(a)', sol: `${a}<i>x</i> − ${2 * k} &ge; 2<i>x</i> − ${2 * b} &rArr; ${a - 2}<i>x</i> &ge; ${2 * k - 2 * b} &rArr; <b><i>x</i> &ge; −${negCount}</b>` },
                    { sub: '(b)', sol: `滿足該不等式的負整數共有 <b>${negCount}</b> 個。` }
                ],
                ineqCheck: [{ label: '(a) x 值的範圍', op: '>=', val: -negCount, display: `x >= -${negCount}` }],
                ansCheck: [{ label: '(b) 負整數的數目', target: `${negCount}`, display: `${negCount}`, mode: 'num' }]
            };
        }
    } else {
        const subType = chooseVariant('ch3_2_a', randomInt(1, 2));
        if (subType === 1) {
            const a = randomInt(3, 5), b = randomInt(2, 5), c = randomInt(3, 5), d = randomInt(6, 12);
            const expr = `−${a}(3<i>x</i> − ${b}) &lt; 2(${c}<i>x</i> + ${d}) − 9<i>x</i>`;
            const coef = -3 * a - 2 * c + 9;
            const rhs = 2 * d - a * b;
            const bound = rhs / coef;
            const minInt = Math.floor(bound) + 1;
            const valHtml = simplifyFrac(rhs, coef);
            return {
                id: `q_${Date.now()}_${Math.random()}`, type: 'ch3_2', level: 'advanced',
                text: ``, marks: '(4分)', vars: ['x'],
                subs: [

                    { label: '(b)', text: `若 <i>x</i> 是一個整數，並能滿足 (a) 中的不等式，求 <i>x</i> 的最小可能值。` }
                ],
                ms: [
                    { sub: '(a)', sol: `−${3 * a}<i>x</i> + ${a * b} &lt; ${2 * c - 9}<i>x</i> + ${2 * d} &rArr; ${coef}<i>x</i> &lt; ${rhs} &rArr; <b><i>x</i> &gt; ${valHtml}</b>` },
                    { sub: '(b)', sol: `滿足不等式的最小可能整數是 <b>${minInt}</b>。` }
                ],
                ineqCheck: [{ label: '(a) 不等式的解', op: '>', val: bound, display: `x > ${valHtml}` }],
                ansCheck: [{ label: '(b) x 的最小可能值', target: `${minInt}`, display: `${minInt}`, mode: 'num' }]
            };
        } else {
            const isEven = Math.random() > 0.5;
            if (isEven) {

                return {

                    text: `若三個連續偶數的和大於 ${S}，求當中最小的偶數的最小可能值。`, marks: '(4分)', vars: ['x'],
                    subs: [],
                    ms: [
                        { sub: '', sol: `設最小的偶數為 <i>x</i>，則其餘兩個偶數為 <i>x</i> + 2 和 <i>x</i> + 4。` },
                        { sub: '', sol: `<i>x</i> + (<i>x</i> + 2) + (<i>x</i> + 4) &gt; ${S} &rArr; 3<i>x</i> &gt; ${S - 6} &rArr; <i>x</i> &gt; ${(rawMin).toFixed(2)}` },
                        { sub: '', sol: `因為 <i>x</i> 是偶數，所以最小的偶數的最小可能值是 <b>${ans}</b>。` }

                };
            } else {
                const k = 3, m = randomInt(45, 75), S = k * m;
                const rawMin = (m + 2) / 2;
                let ans = Math.ceil(rawMin);
                if (ans % 2 === 0) ans++;
                return {
                    id: `q_${Date.now()}_${Math.random()}`, type: 'ch3_2', level: 'advanced',
                    text: `若兩個連續奇數之和的 ${k} 倍大於或等於 ${S}，求當中較大的奇數的最小可能值。`, marks: '(4分)', vars: ['x'],
                    subs: [],
                    ms: [
                        { sub: '', sol: `設較大的奇數為 <i>x</i>，則較小的奇數為 <i>x</i> − 2。` },
                        { sub: '', sol: `${k}[(<i>x</i> − 2) + <i>x</i>] &ge; ${S} &rArr; 2<i>x</i> − 2 &ge; ${m} &rArr; <i>x</i> &ge; ${rawMin}` },
                        { sub: '', sol: `因為 <i>x</i> 是奇數，所以較大的奇數的最小可能值是 <b>${ans}</b>。` }
                    ],
                    ansCheck: [{ label: '較大奇數的最小可能值', target: `${ans}`, display: `${ans}`, mode: 'num' }]
                };
            }
        }
    }
}

function generateCh3_MC() {
    const subType = chooseVariant('ch3_mc', randomInt(1, 4));
    if (subType === 1) {
        const a = randomInt(5, 9), b = randomInt(6, 12), c = randomInt(8, 15);
        const rhs = c + a * b;
        const stmt = `若 <i>x</i> &gt; −${a}，則`;
        const correct = `${c} − ${b}<i>x</i> &lt; ${rhs}`;
        const wrongs = [`${c} − ${b}<i>x</i> &gt; ${rhs}`, `${c} − ${b}<i>x</i> &lt; ${c - a * b}`, `${c} − ${b}<i>x</i> &gt; ${c - a * b}`];
        return makeMC('ch3_mc', 'basic', stmt, correct, wrongs, [
            `<i>x</i> &gt; −${a} &rArr; −${b}<i>x</i> &lt; ${a * b} &rArr; ${c} − ${b}<i>x</i> &lt; ${rhs}。`
        ], subType);
    } else if (subType === 2) {
        const stmt = `若 <i>a</i> &le; <i>b</i>，下列何者必為正確？<br>I. 3<i>a</i> − 4 &le; 3<i>b</i> − 4<br>II. 5 − ${buildFrac('<i>a</i>', 9)} &ge; 5 − ${buildFrac('<i>b</i>', 9)}<br>III. <i>ab</i> &le; <i>b</i><sup>2</sup>`;
        return makeMC('ch3_mc', 'advanced', stmt, '只有 I 及 II', ['只有 I 及 III', '只有 II 及 III', 'I、II 及 III'], [
            `I 及 II 必為正確；對於 III，當 <i>b</i> &lt; 0 時，<i>ab</i> &ge; <i>b</i><sup>2</sup>，故 III 未必正確。`
        ], subType);
    } else if (subType === 3) {
        const stmt = `求滿足不等式 <i>x</i> &ge; −&pi; 的所有負整數的和。`;
        return makeMC('ch3_mc', 'basic', stmt, '−6', ['0', '−3', '−10'], [
            `−&pi; &approx; −3.14，滿足不等式的負整數為 −3、−2 和 −1，其和 = (−3) + (−2) + (−1) = −6。`
        ], subType);
    } else {
        const s1 = randomInt(8, 12), s2 = s1 + 2;
        const diff = s2 - s1;
        const stmt = `已知一個三角形的三條邊分別為 ${s1} cm、${s2} cm 和 <i>x</i> cm。下列何者是 <i>x</i> 的可能值？<br>I. ${diff}<br>II. ${s1}<br>III. ${s2}`;
        return makeMC('ch3_mc', 'advanced', stmt, '只有 II 及 III', ['只有 I', '只有 II', '只有 I 及 III'], [
            `由三角形邊長關係，${s2} − ${s1} &lt; <i>x</i> &lt; ${s1} + ${s2}，即 ${diff} &lt; <i>x</i> &lt; ${s1 + s2}，故只有 II 及 III 可能。`
        ], subType);
    }
}

// ==================== 第 4 章：百分法(二)（不含稅務）生成引擎 ====================
function generateCh4_1(level) {
    const actualLevel = level === 'all' ? pickRandom(['basic', 'advanced']) : level;
    if (actualLevel === 'basic') {
        const subType = chooseVariant('ch4_1_b', randomInt(1, 3));
        if (subType === 1) {
            const orig = pickRandom([40, 50, 60, 80, 100]);
            const p1 = pickRandom([10, 20, 25]), p2 = pickRandom([10, 20, 40, 50]);
            const newV = +(orig * (1 + p1 / 100) * (1 - p2 / 100)).toFixed(2);
            const overallPct = +(((1 + p1 / 100) * (1 - p2 / 100) - 1) * 100).toFixed(2);
            return {
                id: `q_${Date.now()}_${Math.random()}`, type: 'ch4_1', level: 'basic',
                text: `一個水杯的售價先增加 ${p1}%，然後減少 ${p2}%。若該水杯現時的售價為 $${newV}，求`, marks: '(4分)', vars: ['p'],
                subs: [
                    { label: '(a)', text: `該水杯的原價；` },
                    { label: '(b)', text: `該水杯的售價的總百分變化（連同正負號及 %）。` }
                ],
                ms: [
                    { sub: '(a)', sol: `設原價為 $<i>p</i>： <i>p</i>(1 + ${p1}%)(1 − ${p2}%) = ${newV} &rArr; <i>p</i> = <b>$${orig}</b>` },
                    { sub: '(b)', sol: `總百分變化 = ${buildFrac(`${newV} − ${orig}`, orig)} &times; 100% = <b>${overallPct > 0 ? '+' + overallPct : overallPct}%</b>` }
                ],
                ansCheck: [
                    { label: '(a) 原價 ($)', target: `${orig}`, display: `${orig}`, mode: 'num' },
                    { label: '(b) 總百分變化 (%)', target: `${overallPct}`, display: `${overallPct}%`, mode: 'num' }

function generateCh4_MC() {
    const subType = chooseVariant('ch4_mc', randomInt(1, 4));
    if (subType === 1) {
        const p = pickRandom([10, 20, 30]);
        const ans = +(((1 - p / 100) ** 2 - 1) * 100).toFixed(2);
        const correct = `${ans}%`;
        const wrongs = [`−${100 + ans}%`, `−${p}%`, `−${p * 2}%`];
        return makeMC('ch4_mc', 'basic', `某個圓的半徑 <i>r</i> cm 減少 ${p}%。求該圓的面積的百分變化。`, correct, wrongs, [
            `新面積 = &pi;[<i>r</i>(1 − ${p}%)]<sup>2</sup> = ${(1 - p / 100) ** 2}&pi;<i>r</i><sup>2</sup>，面積的百分變化 = <b>${correct}</b>。`
        ], subType);
    } else if (subType === 2) {
        const P0 = pickRandom([50000, 60000, 80000]), r = pickRandom([15, 18, 20]);
        const raw = P0 * Math.pow(1 - r / 100, 4);
        const ans = Number(raw.toPrecision(3));
        const correct = `$${fmtNum(ans)}`;
        const wrongs = [`$${fmtNum(Number((P0 * Math.pow(1 - r / 100, 3)).toPrecision(3)))}`, `$${fmtNum(P0 * (1 - 4 * r / 100))}`, `$${fmtNum(Number((P0 * Math.pow(1 + r / 100, 4)).toPrecision(3)))}`];
        return makeMC('ch4_mc', 'basic', `某汽車的價值每年均折舊 ${r}%。若該汽車四年前的價值是 $${fmtNum(P0)}，求它現時的價值，準確至三位有效數字。`, correct, wrongs, [
            `現時的價值 = $${fmtNum(P0)} &times; (1 − ${r}%)<sup>4</sup> &approx; <b>${correct}</b>（準確至三位有效數字）。`
        ], subType);
    } else if (subType === 3) {
        const P = pickRandom([10000, 20000]), r = pickRandom([3, 6]), yrs = 5;

        const ans = Number(raw.toPrecision(3));
        const correct = `$${fmtNum(ans)}`;

        return makeMC('ch4_mc', 'basic', `若把 $${fmtNum(P)} 存入銀行，年利率為 ${r}%，每月計算複利息一次。求 ${yrs} 年後所得的本利和，準確至三位有效數字。`, correct, wrongs, [
            `5 年共有 60 個月，每月利率 = ${r}% &divide; 12 = ${r / 12}%。<br>本利和 = $${fmtNum(P)} &times; (1 + ${r / 12}%)<sup>60</sup> &approx; <b>${correct}</b>。`
        ], subType);
    } else {
        const r = pickRandom([4, 6, 8]), I = randomInt(75, 95) * 100;
        const P = Math.round(I / (Math.pow(1 + (r / 4) / 100, 4) - 1));
        const correct = `$${fmtNum(P)}`;

function numericValue(v) {
    let z = String(v ?? '').trim().replace(/[，,￥$\s]/g, '').replace(/[−–]/g, '-');

}

    if (!input) return;
    input.focus();
    const start = Number.isInteger(input.selectionStart) ? input.selectionStart : input.value.length;
    const end = Number.isInteger(input.selectionEnd) ? input.selectionEnd : start;
    let before = input.value.slice(0, start), after = input.value.slice(end);
    if (symbol === 'clear') { input.value = ''; }
    else if (symbol === 'backspace') {
        if (start === end && start > 0) before = before.slice(0, -1);

function checkSingleItem(userVal, chk) {
    const mode = chk.mode || 'alg';
    if (mode === 'num') return sameNumber(userVal, chk.target);
    if (mode === 'int_list') {
        const uArr = userVal.split(/[，,、\s]+/).filter(Boolean).map(Number).sort((a, b) => a - b);
        const tArr = chk.target.split(',').map(Number).sort((a, b) => a - b);
        return uArr.length === tArr.length && uArr.every((v, idx) => v === tArr[idx]);
    }
    if (mode === 'sci') {
        const cleanUser = userVal.replace(/\s+/g, '').replace(/×/g, '*').toLowerCase();
        const cleanTarget = chk.target.replace(/\s+/g, '').toLowerCase();
        return cleanUser === cleanTarget || areExpressionsEquivalent(userVal, chk.target);
    }
    if (mode === 'pos_alg') {
        const ast = parseAlgAST(userVal);
        if (!ast || hasNegativeExponentInAST(ast)) return false;
        return areExpressionsEquivalent(userVal, chk.target);
    }
    if (mode === 'exact_str') {
        return userVal.replace(/\s+/g, '') === chk.target.replace(/\s+/g, '');
    }
    const res = checkFactorizationComplete(userVal, chk.target, true);
    return res.ok;
}

function judge() {
    if (!q || lastJudged) return;
    if (checker.type === 'self') {
        enterSelfEvalMode();
        return;
    }
    if (checker.type === 'ineq') {
        let allEmpty = true, allGood = true;
        for (let i = 0; i < checker.checks.length; i++) {
            const chk = checker.checks[i];
            const op = $(`ineq-op-${i}`)?.dataset.operator || '';
            const valStr = ($(`ineq-value-${i}`)?.value || '').trim();
            if (op || valStr) allEmpty = false;
            if (!op || !valStr || !Number.isFinite(numericValue(valStr))) { allGood = false; continue; }
            if (op !== chk.op || !sameNumber(numericValue(valStr), chk.val)) allGood = false;
        }
        if (allEmpty) { enterSelfEvalMode(); return; }
        finish(allGood); return;
    }
    if (checker.type === 'ineq_and_ans') {
        let allEmpty = true, allGood = true;
        for (let i = 0; i < checker.ineqs.length; i++) {
            const chk = checker.ineqs[i];
            const op = $(`ineq-op-${i}`)?.dataset.operator || '';
            const valStr = ($(`ineq-value-${i}`)?.value || '').trim();
            if (op || valStr) allEmpty = false;
            if (!op || !valStr || !Number.isFinite(numericValue(valStr)) || op !== chk.op || !sameNumber(numericValue(valStr), chk.val)) allGood = false;
        }
        for (let i = 0; i < checker.checks.length; i++) {
            const chk = checker.checks[i];
            const userVal = ($(`answer${i}`)?.value || '').trim();
            if (userVal) allEmpty = false;
            if (!userVal || !checkSingleItem(userVal, chk)) allGood = false;
        }
        if (allEmpty) { enterSelfEvalMode(); return; }
        finish(allGood); return;
    }
    if (checker.type === 'ans_checks') {
        const vals = checker.checks.map((_, i) => ($(`answer${i}`)?.value || '').trim());
        if (vals.every(v => !v)) { enterSelfEvalMode(); return; }
        if (vals.some(v => !v)) { $('resultBox').innerHTML = '<div class="result notice">請填妥所有答案欄（或全部留空以進入手寫自評模式）。</div>'; return; }
        const allGood = checker.checks.every((chk, i) => checkSingleItem(vals[i], chk));
        finish(allGood); return;
    }
    if (checker.type === 'mc') {
        const val = ($('answer0')?.value || '').trim().toUpperCase();
        if (!val) { $('resultBox').innerHTML = '<div class="result notice">請先選擇一個選項（A、B、C 或 D）。</div>'; return; }
        finish(val === q.answerLetter); return;
    }
}

function finish(good) {
    if (lastJudged) return;
    lastJudged = true; outcome = good ? 'correct' : 'wrong';
    recordStat($('topicSelect').value, good);
    let refParts = [];
    if (q.answerLetter) refParts.push(q.answerLetter);
    if (q.ineqCheck) refParts.push(...q.ineqCheck.map(c => c.display));
    if (q.ansCheck) refParts.push(...q.ansCheck.map(c => c.display));
    const ref = refParts.join('； ');

    $('resultBox').innerHTML = `<div class="result ${good ? 'success' : 'wrong'}"><h3>${good ? '✅ 答案正確！' : '❌ 答案不正確'}</h3>${good ? '下一題會在所選範圍內隨機生成。' : '下一題會沿用此題型，換上新數字讓你再次挑戰。'}${ref ? `<div>參考答案：<b>${ref}</b></div>` : ''}</div>`;
    showSolution();
    $('checkBtn').disabled = true;
    $('nextBtnBar').hidden = false;
    $('nextBtn').textContent = good ? '下一題 · 隨機題型 →' : '下一題 · 同類題重練 →';
}

$('startBtn').addEventListener('click', () => newQuestion(false));
$('topicSelect').addEventListener('change', () => { refreshStats(); newQuestion(false); });
$('levelSelect').addEventListener('change', () => newQuestion(false));
$('nextBtn').addEventListener('click', () => newQuestion(outcome === 'wrong'));
$('checkBtn').addEventListener('click', judge);
$('showStepsBtn').addEventListener('click', () => {
    if ($('solutionBox').hidden) {
        showSolution();
        $('nextBtnBar').hidden = false;
    } else {
        $('solutionBox').hidden = true;
        setInputCollapsed(false);
        $('showStepsBtn').textContent = '詳解步驟';
    }
});
$('resetStats').addEventListener('click', () => { if (confirm('確定清除本機的練習統計？')) { stats = {}; keepStats(); refreshStats(); } });

// ==================== 全頁防拉動與 Apple Pencil 手寫畫布引擎 ====================
// 防止整個網頁在 iPad Safari 被上下拉動回彈（只允許在已解鎖題目區、詳解滾動區及工具列內滑動）
document.addEventListener('touchmove', ev => {
    const allowVert = ev.target.closest('.sheet.expanded, .feedback-scroll, .answer-grid');
    const allowHoriz = ev.target.closest('.toolbar');
    if (!allowVert && !allowHoriz && ev.cancelable) {
        ev.preventDefault();
    }
}, { passive: false });

let drawingPointerId = null;
function brushStyle(c, st) {
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.globalCompositeOperation = st.tool === 'eraser' ? 'destination-out' : 'source-over';
    c.globalAlpha = st.tool === 'highlighter' ? 0.24 : 1;
    c.strokeStyle = st.tool === 'eraser' ? '#000' : st.color;
    c.lineWidth = st.tool === 'highlighter' ? 24 : st.tool === 'eraser' ? 24 : 2.6;
}
function renderStroke(st, c = ctx) {
    if (!st || !st.points.length) return;
    const w = sheetInner.clientWidth, pts = st.points;
    c.save(); brushStyle(c, st); c.beginPath();
    c.moveTo(pts[0][0] * w, pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0] * w, pts[i][1]);
    if (pts.length === 1) c.lineTo(pts[0][0] * w + 0.1, pts[0][1] + 0.1);
    c.stroke(); c.restore();
}
function clearLive() { liveCtx.clearRect(0, 0, sheetInner.clientWidth, sheetInner.clientHeight); }
function paintLive() { clearLive(); if (drawing) renderStroke(drawing, liveCtx); }
function repaint() {
    ctx.clearRect(0, 0, sheetInner.clientWidth, sheetInner.clientHeight);
    for (const st of strokes) renderStroke(st, ctx);
    paintLive();
}
function resizeCanvas() {
    const r = sheetInner.getBoundingClientRect(); if (!r.width || !r.height) return;
    const d = Math.min(window.devicePixelRatio || 1, 2.5), w = Math.max(1, Math.round(r.width * d)), h = Math.max(1, Math.round(r.height * d));
    if (canvas.width === w && canvas.height === h && liveCanvas.width === w && liveCanvas.height === h) return;
    for (const c of [canvas, liveCanvas]) { c.width = w; c.height = h; c.getContext('2d').setTransform(d, 0, 0, d, 0, 0); }
    repaint();
}
function posOf(ev) { const r = canvas.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width, (ev.clientY - r.top)]; }
function appendPoint(ev) {
    if (!drawing) return;
    const p = posOf(ev), prev = drawing.points[drawing.points.length - 1];
    if (!prev || Math.hypot((p[0] - prev[0]) * sheetInner.clientWidth, (p[1] - prev[1])) > 0.12) drawing.points.push(p);
}
function pointerDown(ev) {
    if (tool === 'off' || (ev.pointerType === 'touch' && $('penOnly').checked)) return;
    if (ev.button !== undefined && ev.button !== 0) return;
    if (drawing || drawingPointerId !== null) return;
    ev.preventDefault();
    drawingPointerId = ev.pointerId;
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) { }
    drawing = { tool, color: inkColor, points: [posOf(ev)] };
    paintLive();
}
function pointerMove(ev) {
    if (!drawing || ev.pointerId !== drawingPointerId) return;
    if (ev.cancelable) ev.preventDefault();
    const samples = ev.getCoalescedEvents?.();
    if (samples && samples.length) { for (const s of samples) appendPoint(s); }
    appendPoint(ev);
    paintLive();
}
function pointerEnd(ev) {
    if (!drawing || ev.pointerId !== drawingPointerId) return;
    if (ev.cancelable) ev.preventDefault();
    appendPoint(ev);
    const finished = drawing;
    drawing = null; drawingPointerId = null;
    renderStroke(finished, ctx); strokes.push(finished); redoStack = []; clearLive();
    try { if (canvas.hasPointerCapture(ev.pointerId)) canvas.releasePointerCapture(ev.pointerId); } catch (e) { }
}

canvas.addEventListener('pointerdown', pointerDown, { passive: false });
canvas.addEventListener('pointermove', pointerMove, { passive: false });
canvas.addEventListener('pointerup', pointerEnd, { passive: false });
canvas.addEventListener('pointercancel', pointerEnd, { passive: false });

for (const name of ['selectstart', 'dragstart', 'contextmenu']) {
    sheet.addEventListener(name, ev => { if (tool !== 'off') ev.preventDefault(); });
}
for (const name of ['touchstart', 'touchmove']) {
    canvas.addEventListener(name, ev => {
        const fingerScroll = sheet.classList.contains('expanded') && $('penOnly').checked;
        if (tool !== 'off' && !fingerScroll && ev.cancelable) ev.preventDefault();
    }, { passive: false });
}

function setInkTool(next) {
    tool = next;
    $('tools').querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
    const isInk = (tool !== 'off');
    canvas.classList.toggle('off', !isInk); sheet.classList.toggle('inking', isInk);
    if (!isInk && drawing) { strokes.push(drawing); drawing = null; drawingPointerId = null; repaint(); }
}

$('tools').addEventListener('click', ev => {
    const btn = ev.target.closest('button'); if (!btn) return;
    if (btn.dataset.tool) setInkTool(btn.dataset.tool);
    if (btn.dataset.color) {
        inkColor = btn.dataset.color;
        $('tools').querySelectorAll('[data-color]').forEach(b => b.classList.toggle('color-active', b.dataset.color === inkColor));
    }
});
$('undoBtn').onclick = () => { if (strokes.length) { redoStack.push(strokes.pop()); repaint(); } };
$('redoBtn').onclick = () => { if (redoStack.length) { strokes.push(redoStack.pop()); repaint(); } };
$('clearBtn').onclick = () => { if (strokes.length && confirm('清除本題全部手寫筆跡？')) { strokes = []; redoStack = []; drawing = null; drawingPointerId = null; repaint(); } };

window.addEventListener('resize', () => requestAnimationFrame(resizeCanvas));
if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => requestAnimationFrame(resizeCanvas));
    ro.observe(sheet); ro.observe(sheetInner);
}
for (const name of ['gesturestart', 'gesturechange']) {
    sheet.addEventListener(name, ev => { if (tool !== 'off') ev.preventDefault(); }, { passive: false });
}

setInkTool('pen');
setSheetLocked($('lockSheet').checked);
refreshStats();
newQuestion(false);
</script>
</body>
</html>
